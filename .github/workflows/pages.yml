name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A crash here used to cancel the whole deploy. The report files were
      # already on main, but the site stayed on the previous successful
      # publish, so the new short URL returned 404. Fall back to those files.
      - name: Rebuild index
        run: |
          if python3 scripts/build_index.py; then
            echo "index rebuilt"
          else
            echo "::warning::build_index.py failed. Publishing the HTML already committed on main so the new report is not left as a 404."
            git checkout -- .
            git clean -fd
          fi

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html latest.html latest-close.html latest-weekly.html latest-us.html _site/
          cp -R archive _site/archive
          cp -R r _site/r
          for dir in ashare us global other; do
            if [ -d "$dir" ]; then cp -R "$dir" "_site/$dir"; fi
          done
          if [ -d us-radar ]; then cp -R us-radar _site/us-radar; fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
