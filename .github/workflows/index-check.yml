name: Check index build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild index
        run: python3 scripts/build_index.py

      - name: Run index checks
        run: |
          python3 scripts/test_close_index.py
          python3 scripts/test_close_prompt.py
          python3 scripts/test_local_archive.py
